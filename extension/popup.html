<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { 
      width: 250px; 
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
      padding: 20px; 
      background: #0a0c14; 
      color: #e5e7eb;
      margin: 0;
    }
    h3 { 
      color: #3b82f6; 
      margin-top: 0; 
      font-size: 18px; 
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .site { 
      font-weight: bold; 
      color: #9ca3af; 
      font-size: 13px; 
      margin-bottom: 6px; 
      word-break: break-all;
    }
    #username { 
      font-size: 14px; 
      color: #ffffff; 
      margin-bottom: 16px; 
      background: #1a1d2e;
      padding: 8px 12px;
      border-radius: 8px;
    }
    #status { 
      font-size: 13px; 
      color: #6b7280; 
      line-height: 1.4;
    }
    button { 
      background: #2563eb; 
      color: white; 
      border: none; 
      padding: 12px; 
      width: 100%; 
      border-radius: 10px; 
      cursor: pointer; 
      font-weight: 700;
      font-size: 14px;
      transition: background 0.2s;
    }
    button:hover { 
      background: #3b82f6; 
    }
    .divider {
      height: 1px;
      background: #1a1d2e;
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <h3><img src="icon.png" width="20" height="20" style="border-radius: 4px;" onerror="this.style.display='none'"> 🔐 VaultX Auto-Fill</h3>
  <div id="status">Connecting to VaultX app...</div>
  <div id="info" style="display:none">
    <div class="site" id="site"></div>
    <div id="username"></div>
    <button id="fillBtn">Auto-Fill Now</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
